[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quantlab-offline"
version = "0.1.0"
description = "Offline quantitative research and execution simulation"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
quantlab = "quantlab.cli:main"

[tool.setuptools.packages.find]
include = ["quantlab*"]
